name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (black)
        run: black --check .

      - name: Types (mypy)
        run: mypy

      - name: Tests (pytest + coverage >= 70%)
        run: pytest

  # The job above installs the newest versions pyproject.toml allows; this one runs the tests on
  # the versions the API image ships, so a lock bump is tested for what it changes.
  lock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: deploy/api/.python-version
          cache: pip

      - name: Lock installs and is complete (pip check)
        run: |
          python -m venv "$RUNNER_TEMP/lock"
          "$RUNNER_TEMP/lock/bin/pip" install --require-hashes --no-deps -r deploy/api/requirements.txt
          "$RUNNER_TEMP/lock/bin/pip" check

      # The lock has no test tools. pip cannot take the hashed lock as a constraint for an editable
      # install, so a plain list of what was just installed keeps every locked version in place.
      - name: Add the test tools without moving a locked version
        run: |
          "$RUNNER_TEMP/lock/bin/pip" freeze --all > "$RUNNER_TEMP/locked.txt"
          "$RUNNER_TEMP/lock/bin/pip" install -e ".[dev]" -c "$RUNNER_TEMP/locked.txt"

      - name: Tests on the locked versions (pytest + coverage >= 70%)
        run: '"$RUNNER_TEMP/lock/bin/pytest"'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Types (tsc)
        run: npm run typecheck

      - name: Tests (Vitest + coverage >= 70%)
        run: npm test

  # The manifests in a real, throwaway cluster, with the images of this pull request and the
  # NetworkPolicies on. There is no Argo CD here, so everything is applied at once: the API may
  # restart until the migration is done, and the sync order is not what this proves. Made-up values
  # only: no stored secret reaches this job, and nothing is pushed.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KIND_VERSION: "0.33.0"
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      # The newest 1.36 node image this kind release names; the server runs k3s 1.36.5.
      KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      KUBECTL_VERSION: "1.37.1"
      KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
      KUSTOMIZE_VERSION: "5.8.3"
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
      API_IMAGE: ghcr.io/gyanendra0/denial-appeal-agent/api:local
      WEB_IMAGE: ghcr.io/gyanendra0/denial-appeal-agent/web:local
      NAMESPACE: denial-appeal-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"

      - name: Install kubectl (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubectl" \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubectl"

      - name: Install kustomize (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize

      - name: Build the API image
        run: docker build -f deploy/api/Dockerfile -t "$API_IMAGE" .

      - name: Build the web image
        run: docker build -f deploy/web/Dockerfile -t "$WEB_IMAGE" .

      - name: Create the cluster
        run: '"$RUNNER_TEMP/kind" create cluster --image "$KIND_NODE_IMAGE" --wait 120s'

      - name: Load the images into the cluster
        run: '"$RUNNER_TEMP/kind" load docker-image "$API_IMAGE" "$WEB_IMAGE"'

      # What production gets from the Sealed Secret and by hand. The API loads its model when it
      # starts, so a tiny made-up one is trained inside the API image, for its scikit-learn version.
      - name: Create the made-up secret and model
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          docker run --rm --user "$(id -u)" --volume "$RUNNER_TEMP/model:/out" \
            --volume "$PWD/pipelines:/app/pipelines:ro" "$API_IMAGE" \
            python -m pipelines.make_smoke_model --out /out
          "$RUNNER_TEMP/kubectl" apply -f deploy/k8s/base/namespace.yaml
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" create secret generic app-secrets \
            --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
            --from-literal=AUTH_TOKEN_SECRET="$(openssl rand -hex 32)" \
            --from-literal=LLM_PRIMARY_API_KEY=made-up \
            --from-literal=LLM_FALLBACK_API_KEY=made-up \
            --from-literal=MAIL_SMTP_USERNAME=made-up \
            --from-literal=MAIL_SMTP_PASSWORD=made-up \
            --from-literal=MAIL_FROM=made-up@example.test \
            --from-literal=GOOGLE_CLIENT_SECRET=made-up \
            --from-literal=ADMIN_EMAILS=made-up@example.test \
            --from-literal=SIGNUP_ALLOWED_EMAILS=made-up@example.test
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" create configmap win-model \
            --from-file="$RUNNER_TEMP/model"

      - name: Apply the local overlay
        run: |
          "$RUNNER_TEMP/kustomize" build deploy/k8s/overlays/local > "$RUNNER_TEMP/local.yaml"
          "$RUNNER_TEMP/kubectl" apply -f "$RUNNER_TEMP/local.yaml"

      - name: The migration finishes
        run: >-
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" wait
          --for=condition=complete job/migrate --timeout=300s

      - name: The database, API and web become ready
        run: |
          for workload in statefulset/db deployment/api deployment/web; do
            "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" rollout status "$workload" --timeout=180s
          done

      # Through Caddy, so a pass means `web` reaches `api` and `api` reaches `db` under the policies.
      - name: "/health answers 200 through the front door"
        run: |
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" port-forward service/web 8080:80 &
          trap 'kill $!' EXIT
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors --max-time 5 \
            http://127.0.0.1:8080/health

      # `api` believes the client address any pod in the range tells it, so this rule is what keeps
      # the login limit safe. Exit 3 is a timeout, what a dropped connection gives; any other failure
      # stops the step, so a broken probe cannot pass as a refusal. Rules take a moment to apply.
      - name: A pod other than web is refused by the API
        run: |
          probe() {
            "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" exec probe -- python -c '
          import socket, sys
          try:
              socket.create_connection(("api", 8000), timeout=3).close()
          except TimeoutError:
              sys.exit(3)
          '
          }
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" apply -f deploy/k8s/smoke/probe.yaml
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" wait --for=condition=ready pod/probe --timeout=60s
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" apply -f deploy/k8s/smoke/probe-allowed.yaml
          reached=no
          for attempt in $(seq 1 10); do
            result=0; probe || result=$?
            if [ "$result" -eq 0 ]; then reached=yes; break; fi
            if [ "$result" -ne 3 ]; then exit "$result"; fi
          done
          test "$reached" = yes
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" delete -f deploy/k8s/smoke/probe-allowed.yaml
          refused=no
          for attempt in $(seq 1 10); do
            result=0; probe || result=$?
            if [ "$result" -eq 3 ]; then refused=yes; break; fi
            if [ "$result" -ne 0 ]; then exit "$result"; fi
            sleep 2
          done
          test "$refused" = yes

      - name: Show what went wrong
        if: failure()
        run: |
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" get pods,jobs,events -o wide
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" describe pods
          "$RUNNER_TEMP/kubectl" --namespace "$NAMESPACE" logs --selector app.kubernetes.io/name \
            --all-containers --prefix --ignore-errors --max-log-requests 10 --tail 100

  # The CronJob's own backup.sh, run the way the CronJob runs it (pinned db image, uid 999,
  # read-only root), then restore.sh into a second server: every table must come back with the same
  # row count. Made-up rows, a throwaway key and a made-up password on a network with no published
  # port. No bucket: rclone only copies the finished file, and the server run proves that part.
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DB_IMAGE: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
      POSTGRES_PASSWORD: made-up
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TCP, not the socket: during its first start the image runs a server on the socket only.
      - name: Start the source and target servers
        run: |
          docker network create backup
          for server in source target; do
            docker run --detach --name "$server" --network backup --env POSTGRES_USER=app \
              --env POSTGRES_PASSWORD --env POSTGRES_DB=app "$DB_IMAGE"
          done
          for server in source target; do
            attempts=0
            until docker exec "$server" pg_isready -h 127.0.0.1 -U app -d app; do
              attempts=$((attempts + 1))
              test "$attempts" -lt 30
              sleep 2
            done
          done

      - name: Load the made-up rows into the source
        run: >-
          docker exec -i source psql -U app -d app -v ON_ERROR_STOP=1
          < tests/deploy/fixtures/backup-rows.sql

      - name: Make a throwaway key pair
        run: |
          mkdir -m 777 "$RUNNER_TEMP/keys" "$RUNNER_TEMP/backup"
          docker run --rm --user 999:999 --read-only --tmpfs /tmp --network none \
            --volume "$RUNNER_TEMP/keys:/keys" --env GNUPGHOME=/tmp/gnupg "$DB_IMAGE" bash -c '
              set -euo pipefail
              mkdir -m 700 "$GNUPGHOME"
              gpg --batch --pinentry-mode loopback --passphrase "" \
                --quick-gen-key backup-restore-ci default default never
              gpg --armor --export backup-restore-ci > /keys/public.asc
              gpg --batch --pinentry-mode loopback --passphrase "" \
                --armor --export-secret-keys backup-restore-ci > /keys/private.asc'

      - name: Back up the source with the CronJob's script, as the CronJob runs it
        run: |
          docker run --rm --user 999:999 --read-only --tmpfs /tmp --network backup \
            --env PGHOST=source --env PGPORT=5432 --env PGUSER=app --env PGDATABASE=app \
            --env PGPASSWORD="$POSTGRES_PASSWORD" \
            --volume "$PWD/deploy/k8s/base/backup:/scripts:ro" \
            --volume "$RUNNER_TEMP/keys:/keys:ro" --volume "$RUNNER_TEMP/backup:/backup" \
            "$DB_IMAGE" bash /scripts/backup.sh /backup /keys/public.asc
          ls -l "$RUNNER_TEMP/backup"

      - name: Restore the dump into a new database on the target
        run: |
          dumps=("$RUNNER_TEMP"/backup/app-*.dump.gpg)
          test "${#dumps[@]}" -eq 1
          docker run --rm --user 999:999 --read-only --tmpfs /tmp --network backup \
            --env PGHOST=target --env PGPORT=5432 --env PGUSER=app \
            --env PGPASSWORD="$POSTGRES_PASSWORD" \
            --volume "$PWD/deploy/k8s/base/backup:/scripts:ro" \
            --volume "$RUNNER_TEMP/keys:/keys:ro" --volume "$RUNNER_TEMP/backup:/backup:ro" \
            "$DB_IMAGE" bash /scripts/restore.sh "/backup/$(basename "${dumps[0]}")" \
            /keys/private.asc restored

      # At least three tables, so two empty outputs cannot pass as equal.
      - name: Every table has the same row count
        run: |
          count() {
            docker exec -i "$1" psql -U app -d "$2" -v ON_ERROR_STOP=1 \
              --no-psqlrc --tuples-only --no-align < deploy/k8s/base/backup/row-counts.sql
          }
          count source app > "$RUNNER_TEMP/source.txt"
          count target restored > "$RUNNER_TEMP/restored.txt"
          cat "$RUNNER_TEMP/source.txt"
          test "$(wc -l < "$RUNNER_TEMP/source.txt")" -ge 3
          diff "$RUNNER_TEMP/source.txt" "$RUNNER_TEMP/restored.txt"

      # Refused by createdb itself, so the check reads its message: any other failure is not a pass.
      - name: A restore into the existing app database is refused
        run: |
          dumps=("$RUNNER_TEMP"/backup/app-*.dump.gpg)
          if docker run --rm --user 999:999 --read-only --tmpfs /tmp --network backup \
            --env PGHOST=target --env PGPORT=5432 --env PGUSER=app \
            --env PGPASSWORD="$POSTGRES_PASSWORD" \
            --volume "$PWD/deploy/k8s/base/backup:/scripts:ro" \
            --volume "$RUNNER_TEMP/keys:/keys:ro" --volume "$RUNNER_TEMP/backup:/backup:ro" \
            "$DB_IMAGE" bash /scripts/restore.sh "/backup/$(basename "${dumps[0]}")" \
            /keys/private.asc app > "$RUNNER_TEMP/refused.txt" 2>&1; then
            echo "a restore into app was not refused"
            exit 1
          fi
          cat "$RUNNER_TEMP/refused.txt"
          grep -q 'database "app" already exists' "$RUNNER_TEMP/refused.txt"

      - name: Show what went wrong
        if: failure()
        run: |
          docker logs source
          docker logs target
