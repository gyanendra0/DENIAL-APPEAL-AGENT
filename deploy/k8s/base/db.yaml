# The database. Only the API and the migration may reach it (NetworkPolicies), and it publishes no
# port outside the cluster. POSTGRES_PASSWORD comes from the Secret `app-secrets`; it goes inside
# DATABASE_URL, so it must be URL-safe: make it with `openssl rand -hex 24`.
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db
          # Same image as deploy/prod/compose.yml; a test keeps the two equal.
          image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          env:
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_DB
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            # A subfolder, because a volume's top folder can hold files of its own (`lost+found`)
            # and initdb refuses a folder that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # `-h 127.0.0.1`, not the socket: the first start's temporary server, which is stopped
          # again, answers only on the socket.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "app"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  # No storageClassName: the cluster's default, local-path on k3s and on kind. The volume outlives
  # the StatefulSet, so a prune or a delete does not take the data with it.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
