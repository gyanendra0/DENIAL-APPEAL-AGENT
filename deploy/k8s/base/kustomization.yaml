apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD applies these in the order of their sync-wave annotations, not the order of this list:
# -2 namespace, settings and network rules, -1 database, 0 migration, 1 API, web and backup. A
# PreSync hook would run before the database exists on the very first sync.
namespace: denial-appeal-agent

resources:
  - namespace.yaml
  - config.yaml
  - network-policies.yaml
  - db.yaml
  - migrate.yaml
  - api.yaml
  - web.yaml
  - backup.yaml

# The backup script and the public key, as files the CronJob mounts. The name gets a hash of the
# contents, so a change to either file gives the CronJob a new ConfigMap.
configMapGenerator:
  - name: backup-files
    files:
      - backup/backup.sh
      - backup/backup-public-key.asc
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
