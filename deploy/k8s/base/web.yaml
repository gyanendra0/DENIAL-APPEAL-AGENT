# The one front door: Caddy serves the screens and passes the API paths to `api`. It is the only
# thing reachable from outside. `externalTrafficPolicy: Local` keeps the visitor's real address,
# which the login limit counts.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
    - name: http3
      port: 443
      protocol: UDP
      targetPort: http3
---
# Caddy's TLS certificates and keys survive a restart, so it does not ask for new ones. The same wave
# as the Deployment, not earlier: local-path makes the volume only once a pod needs it, so Argo CD
# would wait forever on an earlier wave.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  labels:
    app.kubernetes.io/name: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # A rolling update: one node, so the old and the new pod can both use the volume.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/gyanendra0/denial-appeal-agent/web
          env:
            # Each overlay sets it. No default: Caddy's own is `localhost`, which would start and
            # serve the wrong site.
            - name: SITE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SITE_ADDRESS
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: http3
              containerPort: 443
              protocol: UDP
          # Caddy's admin address answers only inside the container, so the probes run there.
          startupProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The Caddy binary carries this capability, so it will not start without it (even with
            # the sysctl for low ports).
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: config
          emptyDir:
            sizeLimit: 16Mi
