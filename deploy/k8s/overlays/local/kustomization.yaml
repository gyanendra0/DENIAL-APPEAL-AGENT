apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: config.yaml
  # No bucket and no `backup-secrets` here, so the nightly backup stays off.
  - target:
      kind: CronJob
      name: backup
    patch: |-
      - op: replace
        path: /spec/suspend
        value: true

# Images built on the spot and loaded with `kind load`, so they have no published digest.
images:
  - name: ghcr.io/gyanendra0/denial-appeal-agent/api
    newTag: local
  - name: ghcr.io/gyanendra0/denial-appeal-agent/web
    newTag: local
