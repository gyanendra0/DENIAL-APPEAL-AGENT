# The keys of `app-secrets`, with no values. It is not in `resources`: an empty secret must never
# reach the cluster.
#   1. Copy this file outside the repository and fill it in. Never commit the filled copy.
#   2. kubeseal --format yaml < filled.yaml > deploy/k8s/overlays/prod/app-secrets.sealed.yaml
#   3. Add the annotation argocd.argoproj.io/sync-wave: "-2" to the sealed file and list that file
#      under `resources`.
# POSTGRES_PASSWORD goes inside the database URL, so make it URL-safe: `openssl rand -hex 24`.
# LLM_FALLBACK_API_KEY and GOOGLE_CLIENT_SECRET go with the values in `config.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: denial-appeal-agent
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  AUTH_TOKEN_SECRET: ""
  LLM_PRIMARY_API_KEY: ""
  LLM_FALLBACK_API_KEY: ""
  MAIL_SMTP_USERNAME: ""
  MAIL_SMTP_PASSWORD: ""
  MAIL_FROM: ""
  GOOGLE_CLIENT_SECRET: ""
  ADMIN_EMAILS: ""
  SIGNUP_ALLOWED_EMAILS: ""
