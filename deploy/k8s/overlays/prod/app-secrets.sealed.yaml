# `app-secrets`, encrypted with the key of the server's Sealed Secrets controller: only that
# controller can open it, and only as `app-secrets` in `denial-appeal-agent`. Made from
# `app-secrets.example.yaml` as its comment says; to change one value, seal the whole file again.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: denial-appeal-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    ADMIN_EMAILS: 
    AUTH_TOKEN_SECRET: 
    GOOGLE_CLIENT_SECRET: 
    LLM_FALLBACK_API_KEY: 
    LLM_PRIMARY_API_KEY: 
    MAIL_FROM: 
    MAIL_SMTP_PASSWORD: 
    MAIL_SMTP_USERNAME: 
    POSTGRES_PASSWORD: 
    SIGNUP_ALLOWED_EMAILS: 
  template:
    metadata:
      name: app-secrets
      namespace: denial-appeal-agent
    type: Opaque
