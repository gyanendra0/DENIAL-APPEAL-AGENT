# The keys of `backup-secrets`, with no values: the bucket's Customer Secret Key, read only by the
# backup's `upload` container. Kept apart from `app-secrets`, which the API reads whole, so the API
# never holds them. Not in `resources`: an empty secret must never reach the cluster. Seal it the
# way `app-secrets.example.yaml` says, as `backup-secrets.sealed.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: backup-secrets
  namespace: denial-appeal-agent
type: Opaque
stringData:
  RCLONE_CONFIG_OCI_ACCESS_KEY_ID: ""
  RCLONE_CONFIG_OCI_SECRET_ACCESS_KEY: ""
