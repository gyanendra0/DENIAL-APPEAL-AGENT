# `backup-secrets`, encrypted with the key of the server's Sealed Secrets controller: only that
# controller can open it, and only as `backup-secrets` in `denial-appeal-agent`. Made from
# `backup-secrets.example.yaml` as its comment says; to change one value, seal the whole file again.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backup-secrets
  namespace: denial-appeal-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    RCLONE_CONFIG_OCI_ACCESS_KEY_ID: 
    RCLONE_CONFIG_OCI_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: backup-secrets
      namespace: denial-appeal-agent
    type: Opaque
