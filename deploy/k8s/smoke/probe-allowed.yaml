# Used by the `smoke` job only, for a moment. With this rule the probe must reach `api`, which shows
# the probe works; once it is deleted the same probe must time out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probe-allowed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: probe
      ports:
        - port: 8000
