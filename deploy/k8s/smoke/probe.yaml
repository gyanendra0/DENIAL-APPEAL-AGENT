# Used by the `smoke` job only; Argo CD never sees this folder. A pod that is not `web`, with its own
# way out to `api`, so that a refusal can only come from the rule on `api` and not from default deny.
# The image holds Python; the job loads it into the cluster and nothing is pulled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probe-out
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: probe
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  labels:
    app.kubernetes.io/name: probe
spec:
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 0
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: ghcr.io/gyanendra0/denial-appeal-agent/api:local
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
