[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denial-appeal-agent"
version = "0.0.1"
description = "Insurance denial analysis and appeal drafting agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "numpy>=2.0",
    "openai>=3.26",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.9",
    "sqlalchemy>=2.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "httpx2>=2.13",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "pipelines", "tests"]

# scikit-learn and joblib ship no type information; what they return is typed where it is used.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/db/migrations/*"]
